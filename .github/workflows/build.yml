name: fp-go-harness CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      dryRun:
        description: 'Dry-Run'
        default: 'true'
        required: false

env:
  DEFAULT_BRANCH: main
  GO_VERSION: stable # always the latest Go release, no backwards compatibility
  NODE_VERSION: 24
  DRY_RUN: true

jobs:
  build:
    name: Build (latest Go)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Check go.mod is tidy
        run: go mod tidy -diff
      - name: Vet
        run: go vet ./...
      - name: Run tests
        run: go test -race -covermode=atomic -coverprofile=coverage.txt ./...

  release:
    name: Release
    needs:
      - build
    if: github.repository == 'Carsten-Leue/fp-go-harness' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      # full checkout for semantic-release
      - name: Full checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Determine release mode
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.event.inputs.dryRun }}" != "true" ]]; then
            echo "DRY_RUN=false" >> $GITHUB_ENV
          elif [[ "${{ github.ref }}" == "refs/heads/${{ env.DEFAULT_BRANCH }}" ]]; then
            echo "DRY_RUN=false" >> $GITHUB_ENV
          fi

      - name: Run semantic release
        run: |
          npx -p conventional-changelog-conventionalcommits@9 -p semantic-release semantic-release --dry-run ${{ env.DRY_RUN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # semantic-release pushes the tag; fetch it to see whether HEAD was released
      - name: Find the release tag
        id: tag
        run: |
          git fetch --tags --force
          echo "tag=$(git tag --points-at HEAD --list 'v*' | head -n 1)" >> $GITHUB_OUTPUT

      - name: Set up Go
        if: steps.tag.outputs.tag != ''
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # builds the binaries (see .goreleaser.yaml) and attaches them to the release
      - name: Attach binaries to the release
        if: steps.tag.outputs.tag != ''
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ steps.tag.outputs.tag }}
